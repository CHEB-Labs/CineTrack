<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="_css/login.css">
    <link rel="stylesheet" href="_css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
    <title>Document</title>
</head>
<body>
    <header>
        <a href="index.html"><img src="_img/Logo.png" class="logo"></a>
    </header>
    <div class="cntr">
        <div class="login">
          <img src="_img/login.png" class="login-img">
          <div class="form-login">
            <p>Registre-se gratuitamente!</p>
            <h1>Bem-vindo!</h1>
            <form action="">
              <button><img src="_img/google.png" alt=""> <p>Registre-se com Google</p></button>
              <hr>
              <input type="text" name="" id="" placeholder="Insira seu nome">
              <input type="email" name="" id="" placeholder="Insira seu email">
              <input type="password" name="" id="" placeholder="Insira sua senha">
              <button type="submit" class="entrar">Entrar</button>
              <p>Já tem uma conta? <a href="login.html"><strong>Faça Login</strong></a></p> 
            </form>
          </div>
        </div>
    </div>
</body>
</html>
